syntax = "proto3";

package greeting;

option java_package = "com.example.greeting.grpc";
option java_multiple_files = true;
option java_outer_classname = "GreetingProto";

service GreetingService {
  rpc greetingMethod (GreetingRequest) returns (GreetingResponse);
}

message GreetingRequest {
  string message = 1;
}

message GreetingResponse {
  string message = 1;
}

